<!DOCTYPE html>
<html>
<head><title>Start SEMS</title></head>
<body style="background:#0A1628;color:#fff;font-family:monospace;padding:40px">
<h1>SEMS Server Starter</h1>
<p>Please open <strong>PowerShell</strong> and run:</p>
<pre style="background:#1A2332;padding:20px;border-radius:8px;font-size:16px;line-height:2">
cd C:\Users\Admin\.gemini\antigravity\scratch\sems\server
node src/index.js
</pre>
<p>Then refresh <a href="http://localhost:5173/login" style="color:#0D7377">http://localhost:5173/login</a></p>
<hr>
<h2>Quick Test</h2>
<button onclick="test()" style="padding:10px 20px;background:#0D7377;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">
Test Backend Connection
</button>
<pre id="result" style="background:#1A2332;padding:20px;border-radius:8px;margin-top:10px"></pre>
<script>
async function test() {
  const el = document.getElementById('result');
  try {
    const res = await fetch('/api/health');
    const data = await res.json();
    el.textContent = '✅ Backend is running!\n' + JSON.stringify(data, null, 2);
    el.style.color = '#10B981';
  } catch(e) {
    el.textContent = '❌ Backend NOT running on port 3001\nPlease run: node src/index.js in the server directory';
    el.style.color = '#EF4444';
  }
}
test();
</script>
</body>
</html>
